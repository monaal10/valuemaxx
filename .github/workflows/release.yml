name: Release

# One git tag -> both pip (PyPI) and npm publish at the SAME version, gated on
# the full test suite. See RELEASING.md. Tag format: v1.2.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 1. Gate: the whole repo must be green before anything publishes.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-extras --dev
      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v$TAG does not match VERSION file ($FILE). Bump VERSION first."
            exit 1
          fi
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest --cov --cov-fail-under=90
      - run: uv run pytest tests/conformance -v

  # 2a. Publish Python -> PyPI (trusted publishing / OIDC; no stored token).
  publish-python:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Stamp version from the tag
        run: uv run python scripts/stamp_version.py "${GITHUB_REF_NAME}"
      - name: Inject the single-wheel bundle config (release-only; never committed)
        run: uv run python scripts/bundle_for_release.py
      # Build the WHEEL ONLY (not an sdist): the wheel force-includes every valuemaxx.*
      # module from its sibling package dirs, and an sdist cannot carry files outside the
      # package tree — `uv build` (sdist+wheel) rebuilds the wheel FROM the sdist and fails
      # with "Forced include not found". `-o dist` pins the output into sdks/python/dist so
      # the publish step finds it (in a uv workspace, a bare `uv build` writes to the
      # workspace-root dist/, not here).
      - name: Build the Python SDK wheel (bundles every valuemaxx.* module + the CLI)
        working-directory: sdks/python
        run: uv build --wheel --package valuemaxx -o dist
      - name: Validate the wheel (PyPI metadata check)
        run: uvx twine check sdks/python/dist/*.whl
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  # 2b. Publish TypeScript -> npm via OIDC TRUSTED PUBLISHING (no stored token).
  # npm trusted publishing went GA 2025-07-31; needs npm >= 11.5.1, a GitHub-hosted
  # runner, a public repo + public package. Provenance attestations are emitted by
  # default — no --provenance flag, no NPM_TOKEN secret. (See RELEASING.md.)
  publish-npm:
    needs: gate
    runs-on: ubuntu-latest  # GitHub-hosted required for OIDC; do not move to self-hosted
    environment: npm
    permissions:
      id-token: write  # OIDC for npm trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: npm >= 11.5.1 (OIDC trusted publishing) needs Node >= 20.17;
          # 22 is the safe, current LTS floor for `npm install -g npm@latest`.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest
      - name: Stamp version from the tag
        run: python3 scripts/stamp_version.py "${GITHUB_REF_NAME}"
      - name: Install + build + test the TS SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Publish to npm (OIDC; provenance by default)
        working-directory: sdks/typescript
        # Idempotent: skip if THIS version is already on the registry. The very first
        # valuemaxx release was published manually (npm can't configure OIDC trusted
        # publishing for a package that doesn't exist yet), so on that tag the version
        # already exists — treat it as a no-op rather than failing the release. Genuinely
        # new versions publish normally via OIDC (no token; provenance by default).
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "valuemaxx@${VERSION}" version >/dev/null 2>&1; then
            echo "valuemaxx@${VERSION} already on npm — skipping (published manually or a re-run)."
          else
            npm publish --access public
          fi

  # 4. Publish the backend container image.
  #
  # This is what makes valuemaxx language-agnostic in practice. The backend is ~20k lines
  # of Python (ingest, store, outcomes, reconciliation, metrics, eval), and a TS user must
  # never have to install Python to run it — so the SAME FastAPI app `valuemaxx up` serves
  # ships as an image the npm CLI can `docker run` on the user's behalf. Without this job
  # the README's `docker run ghcr.io/...` line is a promise the registry cannot keep, and
  # every non-Python user hits `pip install` as a hard prerequisite.
  #
  # Tagged with the release version AND `latest`, so `valuemaxx up` can pin the image to
  # the CLI's own version (an older CLI must not silently drive a newer backend).
  publish-image:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # linux/amd64 + linux/arm64: Apple Silicon is the common local-dev machine, and an
      # amd64-only image would run under emulation there (slow enough to read as broken).
      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/valuemaxx-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/valuemaxx-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
